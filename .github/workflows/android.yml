name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Coloroo Kids APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android launcher and landscape configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # AndroidManifest
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          if 'android:screenOrientation="landscape"' not in s:
              s = s.replace(
                  '<activity ',
                  '<activity android:screenOrientation="landscape" ',
                  1
              )

          manifest.write_text(s)

          # Launcher background
          bg = Path("android/app/src/main/res/values/ic_launcher_background.xml")
          bg.parent.mkdir(parents=True, exist_ok=True)
          bg.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#F3E8FF</color>
          </resources>
          """)

          # Launcher images
          source = Path("assets/icon.png")

          for density in ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"]:
              target_dir = Path(
                  f"android/app/src/main/res/mipmap-{density}"
              )
              target_dir.mkdir(parents=True, exist_ok=True)

              for name in [
                  "ic_launcher.png",
                  "ic_launcher_round.png",
                  "ic_launcher_foreground.png"
              ]:
                  (target_dir / name).write_bytes(source.read_bytes())

          # Adaptive launcher icons
          adaptive = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          """

          adaptive_dir = Path(
              "android/app/src/main/res/mipmap-anydpi-v26"
          )
          adaptive_dir.mkdir(parents=True, exist_ok=True)

          for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              (adaptive_dir / name).write_text(adaptive)

          print("Android launcher icon and landscape configuration restored.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coloroo-Kids-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
